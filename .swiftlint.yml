disabled_rules:
  - force_cast              # Temporarily disable force_cast to avoid build failures
  - function_body_length    # Disable long function checks
  - type_body_length        # Disable long type body checks
  - file_length             # Disable file length checks for large files
  - trailing_whitespace     # Do not fail build on trailing spaces
  - unused_optional_binding # Allow `let _ =` patterns without failing build
  - multiple_closures_with_trailing_closure # Allow trailing closures with multiple closure params
  - nesting               # Allow deeper type nesting
  - trailing_newline      # Do not enforce single trailing newline
  - cyclomatic_complexity # Do not fail build on complex functions
  - vertical_whitespace   # Do not enforce vertical whitespace
  - unneeded_override     # Allow empty overrides
  - unused_closure_parameter # Allow unused closure parameters without _
  - large_tuple           # Allow tuples with more than 2 elements
  - colon                 # Do not enforce colon spacing

line_length:
  warning: 250  # Increase warning threshold for long lines
  error: 600    # Set a high error threshold to prevent failures
  ignores_function_declarations: true
  ignores_comments: true
  ignores_interpolated_strings: true
  ignores_urls: true

# Enable only essential rules or opt-in as needed
opt_in_rules:
  # Add any opt-in rules you want, but avoid those causing issues

excluded:
  # Exclude generated files or third-party if needed
  - Carthage
  - Pods
  - vendor
  - .build

reporter: "xcode"  # Use Xcode reporter for build integration
